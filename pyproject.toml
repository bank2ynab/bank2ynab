[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "bank2ynab"
version = "1.2.0"
description = "Easily convert and import your bank's statements into YNAB."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
  { name = "bank2ynab contributors", email = "torben@g-b.dk" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
]
dependencies = [
  "chardet>=4.0.0,<6.0.0",
  "pandas>=1.3.4",
  "pdfplumber>=0.6.0",
  "platformdirs>=4.0.0",
  "requests>=2.32.0,<3.0.0",
  "xlrd>=2.0.1",
]

[project.urls]
Homepage = "https://github.com/bank2ynab/bank2ynab"
Repository = "https://github.com/bank2ynab/bank2ynab"
Issues = "https://github.com/bank2ynab/bank2ynab/issues"

[project.scripts]
bank2ynab = "bank2ynab.__main__:main"

[dependency-groups]
dev = [
  "bandit>=1.7.1",
  "pydocstyle>=6.1.1",
  "pyupgrade>=2.31.1",
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["bank2ynab"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 79
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
